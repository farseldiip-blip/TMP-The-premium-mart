  <!-- tea 3 -->
  <text x="62" y="774" font-family="Libre Caslon Text, serif" font-size="17" font-weight="700" fill="#1c1c18">Chamomile &amp; Lavender Brew</text>
  <text x="738" y="774" text-anchor="end" font-size="15" font-weight="700" fill="#003629">5.90</text>
