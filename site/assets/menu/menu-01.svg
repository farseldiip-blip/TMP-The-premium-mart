<!-- footer note -->
<text x="400" y="860" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="9" fill="#707974" letter-spacing="0.08em">Oat • Soy • Almond • Coconut +0.60 &amp;nbsp; • &amp;nbsp; Extra shot +0.80</text>
