<text x="400" y="910" text-anchor="middle" font-family="Libre Caslon Text, serif" font-size="11" font-weight="700" fill="#003629" letter-spacing="0.06em">123 HERITAGE LANE — OPEN DAILY 7AM — 7PM</text>
<text x="400" y="930" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="8" fill="#707974" letter-spacing="0.12em">PLEASE INFORM OUR TEAM OF ALLERGIES • ALL PRICES INCLUDE VAT</text>
<text x="400" y="998" text-anchor="middle" font-family="Be Vietnam Pro, sans-serif" font-size="28" fill="#003629" opacity="0.08" font-weight="700" letter-spacing="0.2em">TPM</text>
