<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100" role="img" aria-labelledby="title desc">
<title id="title">TPM Menu — Page 1 — Heritage Coffee &amp; Botanical Teas</title>
<desc id="desc">Heritage coffee and botanical teas menu page</desc>
<rect width="800" height="1100" fill="#fcf9f3"/>
