<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Login — TPM The Premium Mart</title>
  <link rel="icon" href="assets/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css?v=20260515q" />
  <link rel="stylesheet" href="./admin/css/admin.css" />
</head>
<body class="admin-body">
  <div class="admin-login-wrap">
    <div class="admin-card" role="main" aria-labelledby="login-title">
      <div class="admin-brand" aria-label="TPM">
        <span class="admin-brand-mark" aria-hidden="true">TPM</span>
        <span>TPM — Login</span>
      </div>
      <h1 id="login-title" class="admin-title">Welcome back</h1>
      <p class="admin-muted">Sign in to continue. Your session will be kept for browsing.</p>

      <form id="loginForm" novalidate>
        <div class="admin-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@email.com" />
        </div>
        <div class="admin-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••" />
        </div>
        <button type="submit" id="loginBtn" class="admin-btn admin-btn-primary">Sign in</button>
        <div id="loginAlert" class="admin-alert" role="alert" aria-live="polite"></div>
      </form>

      <p class="admin-foot">
        <a href="./index.html">← Back to website</a>
      </p>
      <div id="loginLoading" class="admin-loading" style="display:none">
        <span class="admin-spinner" aria-hidden="true"></span> Checking session…
      </div>
    </div>
  </div>

  <script type="module">
    import { getPublicSupabase } from "./js/supabase.js";

    const supabase = getPublicSupabase();
    const form = document.getElementById("loginForm");
    const alertBox = document.getElementById("loginAlert");
    const btn = document.getElementById("loginBtn");
    const loading = document.getElementById("loginLoading");

    function showAlert(msg, kind="error"){
      alertBox.textContent = msg;
      alertBox.className = "admin-alert show" + (kind==="info" ? " admin-alert--info" : "");
    }
    function hideAlert(){ alertBox.className="admin-alert"; alertBox.textContent=""; }
    function showToast(msg){
      // reuse admin toast if available, fallback to alert
      showAlert(msg, "info");
    }

    // If already authenticated, handle silently without exposing admin status
    (async () => {
      loading.style.display = "grid";
      try {
        const { data: { session } } = await supabase.auth.getSession();
        if (session?.user) {
          const { data: isAdmin } = await supabase.rpc("is_admin");
          if (isAdmin) {
            window.location.replace("./admin/index.html");
            return;
          } else {
            // Already logged in as client — show success and go home, no admin mention
            showToast("Already signed in — continuing to home…");
            setTimeout(()=> window.location.replace("./index.html"), 900);
            return;
          }
        }
      } catch (e) {
        console.warn("[TPM login] pre-check failed", e);
      } finally {
        loading.style.display = "none";
      }
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideAlert();
      const email = form.email.value.trim();
      const password = form.password.value;
      if (!email || !password) { showAlert("Email and password are required."); return; }
      btn.disabled = true; btn.textContent = "Signing in…";
      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        // Check admin quietly — never expose to client
        const { data: isAdmin, error: rpcErr } = await supabase.rpc("is_admin");
        if (rpcErr) throw rpcErr;
        if (isAdmin) {
          showToast("Login successful — opening dashboard…");
          setTimeout(()=> window.location.replace("./admin/index.html"), 700);
        } else {
          showToast("Login successful");
          setTimeout(()=> window.location.replace("./index.html"), 900);
        }
      } catch (err) {
        const msg = err?.message || "Sign-in failed.";
        showAlert(msg);
        console.error("[TPM login] error", err);
      } finally {
        btn.disabled = false; btn.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
